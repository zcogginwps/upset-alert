<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Upset Alert">
  <title>Upset Alert</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚨%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>🚨 Upset Alert</h1>
      <div class="sub">
        <select id="week-select" aria-label="Week"><option>Loading…</option></select>
        <span id="week-label">· FBS scoreboard</span>
      </div>
    </div>
    <div class="controls">
      <div class="filters" id="filters" role="group" aria-label="Conference filters">
        <button class="chip fav" data-conf="fav">★ Favorites</button>
        <button class="chip" data-conf="sec">SEC</button>
        <button class="chip" data-conf="b1g">Big Ten</button>
        <button class="chip" data-conf="b12">Big 12</button>
        <button class="chip" data-conf="acc">ACC</button>
        <button class="chip" data-conf="ind">Independent</button>
        <button class="chip" data-conf="fbs">Remaining FBS</button>
        <button class="chip all" id="chip-all">All</button>
      </div>
      <div class="refresh">
        <span id="updated">Loading…</span>
        <button id="refresh-btn" title="Refresh now">↻</button>
      </div>
    </div>
  </header>

  <main id="board">
    <section class="group" id="group-live" hidden>
      <h2><span class="dot live"></span>Live</h2>
      <div class="list" id="list-live"></div>
    </section>
    <section class="group" id="group-pre" hidden>
      <h2>Upcoming</h2>
      <div class="list" id="list-pre"></div>
    </section>
    <section class="group" id="group-post" hidden>
      <h2>Final</h2>
      <div class="list" id="list-post"></div>
    </section>
    <p class="empty" id="empty" hidden>No games match these filters.</p>
    <p class="error" id="error" hidden></p>
  </main>

  <footer class="legend">
    <span><i class="swatch upset"></i> Upset alert: favorite by 7+ trailing in the 4th</span>
    <span><i class="swatch close"></i> Close game: one score, under 6:00 left</span>
    <span>Live games rank by tier (0–8, 9–16, 17–24…) then time left · Scores &amp; lines from ESPN</span>
  </footer>

  <script src="app.js?v=8"></script>
</body>
</html>
