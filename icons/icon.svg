<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
<defs><clipPath id="cB"><rect width="512" height="512" rx="110"/></clipPath></defs>
<g clip-path="url(#cB)">
  <rect width="512" height="512" fill="#0b0d12"/>
  <rect x="0" y="0" width="252" height="252" fill="#1b4f9c"/>
  <rect x="260" y="0" width="252" height="252" fill="#146b45"/>
  <rect x="0" y="260" width="252" height="252" fill="#8a1a2a"/>
  <rect x="260" y="260" width="252" height="252" fill="#e6b422"/>
  <rect x="0" y="0" width="512" height="512" fill="#000" opacity=".18"/>
</g>

<defs>
  <radialGradient id="leather" cx=".38" cy=".32" r=".8">
    <stop offset="0" stop-color="#b8692e"/><stop offset=".45" stop-color="#8e4a1d"/><stop offset="1" stop-color="#4b2410"/>
  </radialGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<g transform="translate(256 222) rotate(-38)" filter="url(#shadow)">
  <ellipse rx="164" ry="100" fill="url(#leather)" stroke="#2f1608" stroke-width="5"/>
  <ellipse rx="164" ry="100" fill="url(#sheen)"/>
  <!-- seam around the ball -->
  <path d="M-164 0 Q0 -22 164 0" fill="none" stroke="#3a1c0c" stroke-width="3" opacity=".7"/>
  <!-- end stripes -->
  <path d="M-128 -60 Q-104 0 -128 60" fill="none" stroke="#f4efe6" stroke-width="8" stroke-linecap="round" opacity=".9"/>
  <path d="M128 -60 Q104 0 128 60" fill="none" stroke="#f4efe6" stroke-width="8" stroke-linecap="round" opacity=".9"/>
  <!-- lace channel -->
  <line x1="-74" y1="0" x2="74" y2="0" stroke="#2f1608" stroke-width="12" stroke-linecap="round" opacity=".55"/>
  <line x1="-74" y1="0" x2="74" y2="0" stroke="#f4efe6" stroke-width="6" stroke-linecap="round"/>
  <!-- stitches, slightly raised look -->
  <g stroke="#f4efe6" stroke-width="8" stroke-linecap="round">
    <line x1="-52" y1="-15" x2="-52" y2="15"/><line x1="-26" y1="-16" x2="-26" y2="16"/>
    <line x1="0" y1="-17" x2="0" y2="17"/><line x1="26" y1="-16" x2="26" y2="16"/><line x1="52" y1="-15" x2="52" y2="15"/>
  </g>
  <g stroke="#b59f86" stroke-width="2" stroke-linecap="round" opacity=".8">
    <line x1="-49" y1="-13" x2="-49" y2="13"/><line x1="-23" y1="-14" x2="-23" y2="14"/>
    <line x1="3" y1="-15" x2="3" y2="15"/><line x1="29" y1="-14" x2="29" y2="14"/><line x1="55" y1="-13" x2="55" y2="13"/>
  </g>
</g>
<rect x="76" y="356" width="360" height="112" rx="30" fill="#0b0d12" stroke="#ffd166" stroke-width="6"/>
<text x="256" y="442" text-anchor="middle" font-size="96" fill="#ffd166" font-family="-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-weight="900" letter-spacing="6">QBB</text>
